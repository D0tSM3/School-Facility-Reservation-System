<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>CampusRoom — Reset Password</title>
    <meta
      name="description"
      content="Reset your CampusRoom account password using your verification code."
    />

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#5b0617",
              "primary-container": "#7a1f2b",
              secondary: "#795900",
              "secondary-container": "#ffc641",
              tertiary: "#2b2b2b",
              surface: "#f8f9fb",
              "on-surface": "#191c1e",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#564242",
              "outline-variant": "#dcc0c0",
              error: "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
            },
            fontFamily: { sans: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>

    <!-- External Stylesheets in public/css/ -->
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forgot-password.css" />
  </head>
  <body class="min-h-screen bg-surface flex items-center justify-center p-4">
    <main class="w-full max-w-md">
      <!-- Header Banner -->
      <div
        class="relative w-full rounded-t-xl overflow-hidden shadow-xl bg-tertiary"
      >
        <div
          class="absolute inset-0 bg-cover bg-center opacity-30"
          style="background-image: url(&quot;assets/campus-bg.png&quot;)"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-primary/95 via-primary-container/90 to-tertiary/95"
        ></div>
        <div
          class="relative z-10 w-full px-6 py-6 flex flex-col items-center text-center"
        >
          <div
            class="w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center mb-2.5"
          >
            <span
              class="material-symbols-outlined text-secondary-container text-[26px]"
              >lock_reset</span
            >
          </div>
          <h1 class="text-white text-xl font-bold tracking-tight">
            Reset Password
          </h1>
          <p
            class="text-secondary-container text-xs opacity-90 font-medium mt-0.5"
          >
            CampusRoom Account Recovery
          </p>
        </div>
      </div>

      <!-- Recovery Form Card -->
      <div
        class="bg-surface-container-lowest rounded-b-xl shadow-xl border border-t-0 border-outline-variant px-6 py-6"
      >
        <!-- Notification Banners -->
        <div
          id="statusBanner"
          class="hidden mb-4 rounded-lg px-4 py-3 flex items-start gap-2"
        >
          <span
            id="statusIcon"
            class="material-symbols-outlined text-[18px] shrink-0 mt-0.5"
          ></span>
          <p id="statusMsg" class="text-xs font-medium leading-snug"></p>
        </div>

        <!-- Step 1: Request Code -->
        <div id="stepRequest">
          <p class="text-on-surface-variant text-xs text-center mb-4">
            Enter your registered institutional email to receive a recovery
            code.
          </p>
          <div class="mb-4">
            <label
              for="recoveryEmail"
              class="block text-xs font-semibold text-on-surface-variant mb-1"
              >University Email</label
            >
            <input
              type="email"
              id="recoveryEmail"
              placeholder="id@bpu.edu.ph"
              class="w-full bg-stone-50 border border-outline-variant rounded-lg p-2.5 text-sm outline-none focus:border-primary transition"
              required
            />
          </div>
          <button type="button" id="btnSendCode" class="btn-primary">
            Send Recovery Code
          </button>
        </div>

        <!-- Step 2: Input OTP & Set New Password -->
        <div id="stepReset" class="hidden">
          <p class="text-on-surface-variant text-xs text-center mb-4">
            Enter the 6-digit code sent to
            <strong id="displayEmail" class="text-primary"></strong> and choose
            a new password.
          </p>

          <!-- 6-digit OTP Inputs -->
          <label
            class="block text-xs font-semibold text-on-surface-variant text-center mb-2"
            >Verification Code</label
          >
          <div class="flex justify-center gap-1.5 mb-5" id="otpInputs">
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp0"
              autocomplete="one-time-code"
            />
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp1"
            />
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp2"
            />
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp3"
            />
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp4"
            />
            <input
              class="otp-digit"
              type="text"
              inputmode="numeric"
              maxlength="1"
              id="otp5"
            />
          </div>

          <!-- Password Inputs -->
          <div class="space-y-3 mb-5">
            <div>
              <label
                for="newPass"
                class="block text-xs font-semibold text-on-surface-variant mb-1"
                >New Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="newPass"
                  placeholder="Min. 8 characters"
                  class="w-full bg-stone-50 border border-outline-variant rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:border-primary"
                />
                <button
                  type="button"
                  class="pwd-toggle absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant"
                  data-target="newPass"
                  aria-label="Toggle new password visibility"
                >
                  <span class="material-symbols-outlined text-[18px]"
                    >visibility_off</span
                  >
                </button>
              </div>
            </div>
            <div>
              <label
                for="confirmPass"
                class="block text-xs font-semibold text-on-surface-variant mb-1"
                >Confirm New Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="confirmPass"
                  placeholder="Re-enter password"
                  class="w-full bg-stone-50 border border-outline-variant rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:border-primary"
                />
                <button
                  type="button"
                  class="pwd-toggle absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant"
                  data-target="confirmPass"
                  aria-label="Toggle confirm password visibility"
                >
                  <span class="material-symbols-outlined text-[18px]"
                    >visibility_off</span
                  >
                </button>
              </div>
            </div>
          </div>

          <button type="button" id="btnUpdatePassword" class="btn-primary mb-3">
            Update Password &amp; Sign In
          </button>
        </div>

        <!-- Back to Login -->
        <p class="mt-5 text-center text-xs text-on-surface-variant">
          <a
            href="index.html"
            class="text-primary font-semibold hover:underline"
            >&larr; Back to Sign In</a
          >
        </p>
      </div>

      <p class="text-center text-xs text-on-surface-variant opacity-60 mt-3">
        &copy; 2024 Buenavista Polytechnic University. All rights reserved.
      </p>
    </main>

    <!-- External Scripts: Supabase SDK from CDN, then Logic from public/js/ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
